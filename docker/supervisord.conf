; Processos do container do SisREAd. Um worker só: com dois, o merge de Data.data perde
; resultados (docs/problemas-conhecidos.md, item 3).
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:web]
command=frankenphp run --config /etc/caddy/Caddyfile
directory=/app
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker]
; --max-time recicla o processo a cada hora (libera memória); o supervisord o sobe de novo.
command=php /app/artisan queue:work --timeout=600 --tries=3 --sleep=3 --max-time=3600
directory=/app
numprocs=1
autorestart=true
; Espera o job em andamento terminar (até 600s). No Fly, o kill_timeout (máx. 300s) corta antes.
stopwaitsecs=620
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=php /app/artisan schedule:work
directory=/app
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
