name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    name: Testes e estilo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # o Pint compara com a branch base

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, zip, pdo_sqlite, sqlite3, pcntl, posix
          coverage: none
          tools: composer:v2

      - name: Cache do Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Dependências
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Ambiente
        run: |
          cp .env.example .env
          php artisan key:generate

      # phpunit.xml usa SQLite em memória e fila sync: não precisa de banco nem de worker.
      - name: Testes
        run: php artisan test

      # O código anterior ao CI ainda não passa no Pint (24 arquivos em 2026-10-06). Para não
      # bloquear todo PR por isso, checamos só os arquivos PHP alterados. Depois de um
      # `vendor/bin/pint` no repositório inteiro, troque por `vendor/bin/pint --test`.
      - name: Pint (arquivos alterados)
        if: github.event_name == 'pull_request'
        run: |
          arquivos=$(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" -- '*.php')
          if [ -n "$arquivos" ]; then
            vendor/bin/pint --test $arquivos
          else
            echo "Nenhum arquivo PHP alterado."
          fi

  imagem:
    name: Build da imagem Docker
    # Só confere que o Dockerfile compila; a imagem de produção é construída na VM.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    needs: [testes, imagem]
    # A chave só existe no ambiente `producao`, que aceita apenas a main; PRs nunca chegam aqui.
    # Para pausar durante sessões do estudo: DEPLOY_AUTOMATICO=false (docs/deploy.md).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_AUTOMATICO == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: producao
    concurrency:
      group: deploy-producao
      cancel-in-progress: false
    permissions: {}
    # Sem checkout e sem actions de terceiros: nenhum código além destas linhas vê a chave.
    steps:
      - name: Disparar o deploy na VM
        env:
          CHAVE: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST_KEY: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DESTINO: ${{ vars.DEPLOY_DESTINO }}
        run: |
          install -m 700 -d ~/.ssh
          ( umask 077; echo "$CHAVE" > ~/.ssh/deploy )
          echo "$HOST_KEY" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 "$DESTINO"
